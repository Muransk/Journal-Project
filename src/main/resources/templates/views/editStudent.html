<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="ISO-8859-1">
        <title>Students Edit</title>
    </head>
    <body>
        <h1>Edit Student:</h1>
        <form th:method="PATCH" th:action="@{/students/{id}(id=${student.getId()})}" th:object="${student}">
            <input type="text" th:field="*{name}" placeholder="Name"/>
            <input type="text" th:field="*{surname}" placeholder="Surname"/>s
            <br>
            <input type="submit" value="Update"/>
        </form>
    </body>
