<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="ISO-8859-1">
        <title>Students</title>
    </head>
    <body>
        <h1>Student Details:</h1>
        <div>
            <p>ID:</p>
            <p th:text="${student.getId()}">Value</p> <br>
            <p>Name:</p>
            <p th:text="${student.getName()}">Value</p> <br>
            <p>Surname:</p>
            <p th:text="${student.getSureName()}">Value</p>
            <a th:href="@{/students/{id}/edit(id=${student.getId()})}">Edit</a>
        </div>

        <form th:method="DELETE" th:action="@{/students/{id}(id=${student.getId()})}">
            <input type="submit" value="Delete"/>
        </form>
    </body>
