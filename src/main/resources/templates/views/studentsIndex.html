<!DOCTYPE html>

<html  xmlns:th="http://www.thymeleaf.org" lang="en">


 
    <head>
        <meta charset="UTF-8">
        <title>Students</title>
    </head>

    <body>
        <h1>Students:</h1>
      <div th:each="student : ${students}">
            <a th:href="@{/students/{id}(id=${student.getId()})}" th:text="${student.getName()}" >Student</a>
        </div>
      <br>
      <hr>

       <a th:href="@{/students/add}">Create new student</a>
    </body>
    </html>
